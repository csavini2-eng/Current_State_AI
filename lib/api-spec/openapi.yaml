openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /guest-sharing:
    post:
      operationId: beginGuestShare
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestSnapshot" }
      responses:
        "201":
          description: Draft capabilities, not yet shared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestCredentials" }
  /guest-sharing/resolve:
    get:
      operationId: resolveGuestShare
      responses:
        "200":
          description: Assignment accessible to the bearer capability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestView" }
  /guest-sharing/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGuestShare
      responses:
        "200":
          description: Current shared assignment and practice history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestView" }
    put:
      operationId: publishGuestShare
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestSnapshot" }
      responses:
        "200":
          description: Validated snapshot published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestView" }
    delete:
      operationId: revokeGuestShare
      responses:
        "204": { description: Handler capability revoked }
  /guest-sharing/{id}/uploads:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: requestGuestUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Bounded upload ticket for this assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestUploadTicket" }
  /guest-sharing/{id}/uploads/{mediaId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: mediaId, in: path, required: true, schema: { type: string } }
    post:
      operationId: confirmGuestUpload
      responses:
        "204": { description: "Size, type and signature verified" }
  /guest-sharing/{id}/media/{mediaId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: mediaId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getGuestMedia
      responses:
        "200":
          description: Capability-protected media
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /guest-sharing/{id}/entries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: submitGuestPractice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeEntry" }
      responses:
        "200":
          description: Practice entry appended idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestView" }
  /guest-sharing/{id}/entries/{entryId}/note:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: entryId, in: path, required: true, schema: { type: string } }
    put:
      operationId: saveGuestPracticeNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PracticeNoteInput" }
      responses:
        "200":
          description: Note saved without changing instructions or progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestView" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /training/workspace:
    get:
      operationId: getTrainingWorkspace
      responses:
        "200":
          description: Trainer workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
    put:
      operationId: saveTrainingWorkspace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceResponse" }
        "409": { description: Another tab saved a newer revision }
  /training/shares:
    get:
      operationId: getHandlerShares
      responses:
        "200":
          description: Active handler links owned by the trainer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HandlerShare" }
    post:
      operationId: createHandlerShare
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandlerShareInput" }
      responses:
        "200":
          description: Live read-only share link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandlerShare" }
  /training/shares/{id}:
    delete:
      operationId: revokeHandlerShare
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Link revoked }
  /training/handler/{id}:
    get:
      operationId: getHandlerPath
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Latest approved path, read only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandlerPath" }
        "404": { description: Missing or revoked link }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Direct upload ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
  /storage/uploads/confirm:
    post:
      operationId: confirmUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaInput" }
      responses:
        "200":
          description: Validated permanent media
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaResult" }
components:
  schemas:
    PracticeOutcome:
      type: string
      enum: [responded, prompting, incomplete, unsure]
    PracticeFeedback:
      type: object
      required: [source, originalDescription, outcome, text]
      properties:
        source: { type: string, enum: [Simulated handler-reported feedback] }
        originalDescription: { type: string, maxLength: 4000 }
        outcome: { $ref: "#/components/schemas/PracticeOutcome" }
        text: { type: string, maxLength: 10000 }
    PracticeEntry:
      type: object
      required: [id, milestoneId, createdAt, videoPath, description, outcome]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        milestoneId: { type: string, minLength: 1, maxLength: 100 }
        createdAt: { type: string, maxLength: 50 }
        videoPath: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 4000 }
        outcome: { $ref: "#/components/schemas/PracticeOutcome" }
        feedback: { $ref: "#/components/schemas/PracticeFeedback" }
    PracticeNoteInput:
      type: object
      required: [description, outcome, text]
      properties:
        description: { type: string, maxLength: 4000 }
        outcome: { $ref: "#/components/schemas/PracticeOutcome" }
        text: { type: string, maxLength: 10000 }
    GuestSnapshot:
      type: object
      required: [dog, path, assignment]
      properties:
        dog: { $ref: "#/components/schemas/DogProfile" }
        path:
          type: object
          required: [id, name, description]
          properties:
            id: { type: string, minLength: 1, maxLength: 100 }
            name: { type: string, maxLength: 150 }
            description: { type: string, maxLength: 2000 }
        assignment: { $ref: "#/components/schemas/DogAssignment" }
    GuestCredentials:
      type: object
      required: [id, managementToken, handlerToken]
      properties:
        id: { type: string }
        managementToken: { type: string }
        handlerToken: { type: string }
    GuestView:
      type: object
      required: [id, snapshot, entries, active, revoked, revision]
      properties:
        id: { type: string }
        snapshot: { $ref: "#/components/schemas/GuestSnapshot" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/PracticeEntry" }
        active: { type: boolean }
        revoked: { type: boolean }
        revision: { type: integer }
    GuestUploadTicket:
      type: object
      required: [mediaId, uploadURL, videoPath]
      properties:
        mediaId: { type: string }
        uploadURL: { type: string }
        videoPath: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MilestoneContent:
      type: object
      required: [name, description, command, handSignal, instructions, category, difficulty, videoPath]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 1000 }
        command: { type: string, maxLength: 500 }
        handSignal: { type: string, maxLength: 2000 }
        instructions: { type: string, maxLength: 12000 }
        category: { type: string, maxLength: 100 }
        difficulty: { type: string, enum: [Beginner, Intermediate, Advanced] }
        videoPath: { type: string, maxLength: 500 }
    MilestoneTemplate:
      allOf:
        - $ref: "#/components/schemas/MilestoneContent"
        - type: object
          required: [id]
          properties:
            id: { type: string, minLength: 1, maxLength: 100 }
    PathStep:
      type: object
      required: [id, templateId, customization]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        templateId: { type: string, minLength: 1, maxLength: 100 }
        customization:
          anyOf:
            - $ref: "#/components/schemas/MilestoneContent"
            - type: "null"
    TrainingProgram:
      type: object
      required: [id, name, description, steps]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 2000 }
        steps:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/PathStep" }
    DogProfile:
      type: object
      required: [id, name, breed, trainingType, birthDate, handlerName, photo]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 150 }
        breed: { type: string, maxLength: 150 }
        trainingType: { type: string, maxLength: 150 }
        birthDate: { type: string, maxLength: 10 }
        handlerName: { type: string, maxLength: 150 }
        photo: { type: string, maxLength: 500 }
    SampleFeedbackNote:
      type: object
      required: [source, text]
      properties:
        source:
          type: string
          enum: [Simulated sample feedback]
        text: { type: string, minLength: 1, maxLength: 10000 }
    AssignedMilestone:
      type: object
      required: [id, templateId, content, practiceVideoPath]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        templateId: { type: string, minLength: 1, maxLength: 100 }
        content: { $ref: "#/components/schemas/MilestoneContent" }
        practiceVideoPath: { type: string, maxLength: 500 }
        sampleFeedbackNote:
          $ref: "#/components/schemas/SampleFeedbackNote"
        practiceEntries:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/PracticeEntry" }
    DogAssignment:
      type: object
      required: [id, dogId, pathId, progress]
      properties:
        id: { type: string, minLength: 1, maxLength: 100 }
        dogId: { type: string, minLength: 1, maxLength: 100 }
        pathId: { type: string, minLength: 1, maxLength: 100 }
        milestones:
          type: array
          maxItems: 200
          description: Independent dog-assigned snapshots; omitted only in legacy records.
          items: { $ref: "#/components/schemas/AssignedMilestone" }
        progress:
          type: object
          additionalProperties:
            type: string
            enum: [not-started, in-progress, completed]
    TrainingWorkspace:
      type: object
      required: [version, dogs, paths, milestones, assignments]
      properties:
        version: { type: integer, enum: [2] }
        dogs:
          type: array
          maxItems: 300
          items: { $ref: "#/components/schemas/DogProfile" }
        paths:
          type: array
          maxItems: 300
          items: { $ref: "#/components/schemas/TrainingProgram" }
        milestones:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/MilestoneTemplate" }
        assignments:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/DogAssignment" }
    WorkspaceInput:
      type: object
      required: [state, revision]
      properties:
        state: { $ref: "#/components/schemas/TrainingWorkspace" }
        revision: { type: integer, minimum: 0 }
    WorkspaceResponse:
      type: object
      required: [state, revision, updatedAt]
      properties:
        state:
          anyOf:
            - $ref: "#/components/schemas/TrainingWorkspace"
            - type: "null"
        revision: { type: integer }
        updatedAt: { type: ["string", "null"] }
    HandlerShareInput:
      type: object
      required: [assignmentId, handlerName]
      properties:
        assignmentId: { type: string, minLength: 1, maxLength: 100 }
        handlerName: { type: string, minLength: 1, maxLength: 150 }
    HandlerShare:
      type: object
      required: [id, assignmentId, handlerName]
      properties:
        id: { type: string }
        assignmentId: { type: string }
        handlerName: { type: string }
    HandlerMilestone:
      allOf:
        - $ref: "#/components/schemas/MilestoneContent"
        - type: object
          required: [id, status]
          properties:
            id: { type: string }
            status: { type: string, enum: [not-started, in-progress, completed] }
    HandlerPath:
      type: object
      required: [dog, pathName, pathDescription, handlerName, milestones, updatedAt]
      properties:
        dog: { $ref: "#/components/schemas/DogProfile" }
        pathName: { type: string }
        pathDescription: { type: string }
        handlerName: { type: string }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/HandlerMilestone" }
        updatedAt: { type: string }
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, maxLength: 250 }
        size: { type: integer, minimum: 1, maximum: 52428800 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, video/mp4, video/webm, video/quicktime] }
    UploadTicket:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    MediaInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, maxLength: 200 }
    MediaResult:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }

